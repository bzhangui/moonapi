name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 action runtime
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24 action runtime
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Install current stable MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --fail --show-error --location https://cli.moonbitlang.com/install/unix.sh --output "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install current stable MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'install-moon.ps1'
          Invoke-WebRequest 'https://cli.moonbitlang.com/install/powershell.ps1' -OutFile $installerPath
          & $installerPath
          if (-not $?) { throw 'MoonBit installation failed' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"
      - name: Install locked standards-adapter dependencies
        # Exact lockfile, no dependency lifecycle scripts. No global install.
        run: npm ci --ignore-scripts --no-fund
      - name: Check build test examples and core coverage (all targets)
        run: node scripts/validate.mjs
      - name: Portable runtime bundle
        run: node scripts/package.mjs
      - name: Independent PocketBase 0.40.5 SQLite integration (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          backend_dir="$RUNNER_TEMP/moonapi-pocketbase-0.40.5"
          mkdir "$backend_dir"
          curl --fail --show-error --location --max-time 120 'https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/checksums.txt' --output "$backend_dir/checksums.txt"
          curl --fail --show-error --location --max-time 120 --max-filesize 67108864 'https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/pocketbase_0.40.5_linux_amd64.zip' --output "$backend_dir/pocketbase_0.40.5_linux_amd64.zip"
          (cd "$backend_dir" && sha256sum --check --ignore-missing checksums.txt && unzip -q pocketbase_0.40.5_linux_amd64.zip)
          node scripts/interop-pocketbase.mjs --pocketbase "$backend_dir/pocketbase"
